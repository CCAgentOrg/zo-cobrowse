<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zo Co-browse — Settings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 540px; margin: 0 auto; padding: 28px 24px; }
    h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variation-settings: 'wght' 700, 'SOFT' 80; color: var(--text); margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin: 0 0 24px; }
    .settings-section { margin-bottom: 20px; }
    .settings-section h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; font-variation-settings: 'wght' 600, 'SOFT' 60; color: var(--text); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .field-group { margin-bottom: 14px; }
    input[type="text"], input[type="password"], input[type="url"] { width: 100%; box-sizing: border-box; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-row .btn { flex: 0 0 auto; }
    .inline-status { font-size: 12px; margin-top: 4px; padding: 4px 8px; border-radius: 4px; }
    .inline-status.ok { background: color-mix(in srgb, var(--amber) 15%, transparent); color: var(--amber); }
    .inline-status.err { background: color-mix(in srgb, #ef4444 15%, transparent); color: #ef4444; }
    .inline-status.pending { background: color-mix(in srgb, var(--indigo) 15%, transparent); color: var(--indigo); }
    .quick-action-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .quick-action-row input[type="text"]:first-child { flex: 0 0 100px; }
    .quick-action-row input[type="text"]:last-child { flex: 1; }
    .quick-action-row .btn { flex: 0 0 auto; }
    .add-action-btn { margin-top: 6px; }
  </style>
</head>
<body>
  <h1>✦ Zo Co-browse</h1>
  <p class="subtitle">Configure your co-browsing connection to Zo Computer</p>

  <form id="settings-form">
    <div class="settings-section">
      <h2>Connection</h2>
      <div class="field-group">
        <label for="access-token">Zo Access Token</label>
        <input type="password" id="access-token" placeholder="zo_…" />
      </div>
      <div class="field-group">
        <label for="api-url">API URL</label>
        <input type="url" id="api-url" placeholder="https://api.zo.computer/zo/ask" />
      </div>
      <div class="field-group">
        <label for="space-endpoint">Zo.space Endpoint</label>
        <input type="url" id="space-endpoint" placeholder="https://cashlessconsumer.zo.space" />
      </div>
      <div class="btn-row">
        <button type="button" id="test-btn" class="btn btn-primary">Test Connection</button>
        <button type="submit" class="btn">Save Settings</button>
      </div>
      <div id="status-message" class="inline-status"></div>
    </div>

    <div class="settings-section">
      <h2>Model &amp; Persona</h2>
      <div class="field-group">
        <label for="model">Default Model</label>
        <select id="model" style="width:100%">
          <option value="">— needs token —</option>
        </select>
        <div id="model-status" class="inline-status" style="margin-top:4px;"></div>
      </div>
      <div class="field-group">
        <label for="persona">Default Persona</label>
        <select id="persona-select" style="width:100%">
          <option value="">Zo (default)</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <h2>Quick Actions</h2>
      <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">Chips shown above the input for one-click prompts.</p>
      <div id="quick-actions-list"></div>
      <button type="button" id="add-action-btn" class="btn btn-sm add-action-btn">+ Add Action</button>
    </div>

    <div class="settings-section">
      <h2>Speech</h2>
      <div class="field-group">
        <label for="tts-lang">TTS Language</label>
        <input type="text" id="tts-lang" placeholder="en-US" />
      </div>
      <div class="field-group">
        <label for="tts-rate">TTS Rate (0.5 – 2.0)</label>
        <input type="text" id="tts-rate" placeholder="1.0" />
      </div>
    </div>

    <div class="btn-row">
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </div>
  </form>

  <script src="options.js"></script>
</body>
</html>
