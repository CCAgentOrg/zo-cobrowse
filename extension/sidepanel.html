<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zo Co-browse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="sidepanel">
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="brand-row">
        <span class="brand-logo">⢕⣿ Zo-Cobrowse</span>
        <span class="brand-tagline">Co-browse with your Zo</span>
        <span id="status-dot" class="dot dot-disconnected" title="Disconnected"></span>
        <span style="flex:1"></span>
        <button id="help-btn" class="btn btn-sm btn-ghost" title="What is co-browsing?">?</button>
        <button id="new-chat-btn" class="btn btn-sm" title="New conversation">✚</button>
        <button id="history-btn" class="btn btn-sm" title="History">☰</button>
      </div>
      <div class="page-info" id="page-info">
        <span class="page-url" id="page-url">— no page —</span>
      </div>
    </header>

    <!-- Chat view -->
    <div id="chat-view">
      <!-- Messages -->
      <div id="messages" role="log" aria-live="polite">
        <div class="msg msg-system">
          <div class="msg-body">Connected to Zo. Ask me about this page, or tell me what to do.</div>
        </div>
      </div>

      <!-- Actions bar (auto-execution controls) -->
      <div id="actions-bar" class="hidden">
        <div class="actions-header">
          <span id="actions-reasoning"></span>
          <button id="run-all-btn" class="btn btn-primary btn-sm">▶ Run All</button>
          <button id="skip-btn" class="btn btn-sm">✕ Skip</button>
        </div>
      </div>

      <!-- Toolbar: model, persona, preset near the input -->
      <div id="toolbar" class="toolbar">
        <select id="model-select" class="tb-select" title="AI Model">
          <option value="">Default model</option>
        </select>
        <select id="persona-select" class="tb-select" title="Persona">
          <option value="">Zo (default)</option>
        </select>
        <select id="preset-select" class="tb-select" title="Preset">
          <option value="">Default (co-browse)</option>
          <option value="research">🔬 Research Deep-dive</option>
          <option value="scrape">📥 Data Extraction</option>
          <option value="summarize">📝 Summarizer</option>
          <option value="qa">❓ Q&A</option>
        </select>
        <button id="create-preset-btn" class="btn btn-sm tb-btn" title="Create a custom preset with Zo">+</button>
      </div>

      <!-- Input area -->
      <div id="input-area">
        <div class="input-row">
          <input
            type="text"
            id="query-input"
            placeholder="Ask Zo about this page..."
            autofocus
          />
          <button id="send-btn" class="btn btn-primary" title="Send">→</button>
        </div>
        <div class="input-row action-chips" id="action-chips">
          <!-- Chips rendered dynamically from storage -->
        </div>
      </div>
    </div>

    <!-- History view -->
    <div id="history-view" class="hidden">
      <div class="history-header">
        <button id="back-to-chat-btn" class="btn btn-sm" title="Back to chat">← Back</button>
        <span class="history-header-title">Conversations</span>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
