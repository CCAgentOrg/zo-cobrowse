name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Validate extension JS
        run: |
          for f in extension/*.js; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check for issues
        run: |
          echo "=== checking TODO markers ==="
          grep -rn 'TODO\|FIXME\|HACK' extension/*.js extension/*.html backend/*.ts 2>/dev/null || echo "none found"
          echo "=== checking line endings ==="
          file extension/*.js extension/*.html extension/*.css

  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create extension package
        run: |
          mkdir -p dist
          cp -r extension dist/zo-cobrowse
          cd dist && zip -r ../zo-cobrowse.zip zo-cobrowse/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zo-cobrowse-extension
          path: zo-cobrowse.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: zo-cobrowse.zip
          generate_release_notes: true
