name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Validate schemas
        run: |
          echo "=== Message types ==="
          grep -c "MessageType" tests/schemas/messages.ts
          echo "=== Bang commands ==="
          bun run --eval "
            import { readFileSync } from 'fs';
            const src = readFileSync('tests/schemas/bang-commands.ts', 'utf-8');
            const zMatch = src.match(/z\.union\(\[([^\]]+)\]/);
            const count = src.match(/z\.union/g);
            console.log('Bang command schemas:', count ? count.length : 0);
          "
          echo "=== Config schema ==="
          test -f tests/schemas/config.ts && echo "config.ts OK" || echo "MISSING config.ts"
          echo "=== Manifest schema ==="
          test -f tests/schemas/manifest.ts && echo "manifest.ts OK" || echo "MISSING manifest.ts"

      - name: Validate extension JS
        run: |
          for f in extension/*.js; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run linter
        run: bun run lint

  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create extension package
        run: |
          mkdir -p dist
          cp -r extension dist/zo-cobrowse
          cd dist && zip -r ../zo-cobrowse.zip zo-cobrowse/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zo-cobrowse-extension
          path: zo-cobrowse.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: zo-cobrowse.zip
          generate_release_notes: true
