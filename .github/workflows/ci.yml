name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
        env:
          BUN_ENV: test

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest: valid')"

      - name: Validate extension JS files
        run: |
          for f in extension/*.js; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

      - name: Check Chrome API usage
        run: |
          echo "=== Chrome API calls in extension ==="
          grep -rn 'chrome\.' extension/*.js | grep -v 'console\.\|// ' | sort -u || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check for TODO/FIXME/HACK
        run: |
          if grep -rn 'TODO\|FIXME\|HACK' extension/*.js extension/*.html extension/*.css backend/*.ts 2>/dev/null; then
            echo "WARNING: Found TODO/FIXME/HACK markers above"
          else
            echo "No TODO/FIXME/HACK markers found"
          fi

      - name: Check line endings
        run: file extension/*.js extension/*.html extension/*.css 2>/dev/null

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create extension artifact
        run: |
          mkdir -p dist/zo-cobrowse
          cp -r extension/* dist/zo-cobrowse/
          cd dist && zip -r ../zo-cobrowse.zip zo-cobrowse/
          echo "✅ Artifact: zo-cobrowse.zip ($(du -h ../zo-cobrowse.zip | cut -f1))"

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: zo-cobrowse-extension
          path: zo-cobrowse.zip

      - name: Create GitHub Release (tagged only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: zo-cobrowse.zip
          generate_release_notes: true
